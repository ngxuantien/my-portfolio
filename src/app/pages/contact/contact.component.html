<section
  id="contact"
  class="min-h-screen bg-app-surface-muted text-app-text px-4 py-20 md:px-8 md:py-24 lg:px-8 lg:py-28"
>
  <div class="max-w-2xl mx-auto">
    <div class="mb-8 md:mb-10 lg:mb-12 text-center">
      <h2 class="text-xl md:text-2xl lg:text-3xl font-bold tracking-tight">
        Let's Connect
      </h2>
    </div>

    <div
      class="bg-app-surface p-5 md:p-8 lg:p-10 rounded-2xl md:rounded-3xl border border-app-border"
    >
      <form class="space-y-5 md:space-y-6" (ngSubmit)="sendMail()">
        <div>
          <label
            class="block text-app-text-muted text-xs md:text-sm font-medium tracking-widest mb-2"
          >
            Your Name
          </label>

          <input
            type="text"
            name="name"
            [(ngModel)]="contactForm.name"
            class="w-full bg-transparent border border-app-border rounded-xl px-4 py-3 md:py-4 text-sm md:text-base focus:outline-none focus:border-brand-secondary transition"
          />
        </div>

        <div>
          <label
            class="block text-app-text-muted text-xs md:text-sm font-medium tracking-widest mb-2"
          >
            Email Address
          </label>

          <input
            type="email"
            name="email"
            [(ngModel)]="contactForm.email"
            class="w-full bg-transparent border border-app-border rounded-xl px-4 py-3 md:py-4 text-sm md:text-base focus:outline-none focus:border-brand-secondary transition"
          />
        </div>

        <div>
          <label
            class="block text-app-text-muted text-xs md:text-sm font-medium tracking-widest mb-2"
          >
            Your Message
          </label>

          <textarea
            rows="4"
            name="message"
            [(ngModel)]="contactForm.message"
            class="w-full bg-transparent border border-app-border rounded-xl px-4 py-3 md:py-4 text-sm md:text-base focus:outline-none focus:border-brand-secondary transition resize-none"
          ></textarea>
        </div>

        <button
          type="submit"
          class="w-full cursor-pointer px-6 md:px-8 py-3.5 md:py-4 text-sm md:text-base font-medium rounded-full text-black bg-linear-to-r from-brand-secondary to-brand-hover transition-all duration-300 shadow-md hover:shadow-lg hover:-translate-y-0.5"
        >
          Send Message
        </button>

        <div
          class="text-app-text-soft text-sm md:text-base transition text-center leading-relaxed"
        >
          <span>If your mail app does not open, contact me directly at</span>

          <a
            href="mailto:xuantien24689@gmail.com"
            class="block mt-1 text-app-text-primary hover:underline underline-offset-4 transition break-all"
          >
            xuantien24689&#64;gmail.com
          </a>
        </div>

        <div class="flex justify-center items-center gap-4 md:gap-6 text-sm">
          <!-- Mail -->
          <a
            href="mailto:xuantien24689@gmail.com"
            aria-label="Email"
            class="group w-10 h-10 md:w-12 md:h-12 rounded-full border border-app-border bg-app-surface flex items-center justify-center hover:bg-yellow-400 hover:border-yellow-400 transition hover:-translate-y-0.5"
          >
            <img
              src="./icon/mail.svg"
              alt=""
              class="w-5 h-5 md:w-6 md:h-6 transition group-hover:brightness-0"
            />
          </a>

          <!-- Phone -->
          <a
            href="tel:0855247441"
            aria-label="Phone"
            class="group w-10 h-10 md:w-12 md:h-12 rounded-full border border-app-border bg-app-surface flex items-center justify-center hover:bg-yellow-400 hover:border-yellow-400 transition hover:-translate-y-0.5"
          >
            <img
              src="./icon/phone.svg"
              alt=""
              class="w-5 h-5 md:w-6 md:h-6 transition group-hover:brightness-0"
            />
          </a>

          <!-- GitHub -->
          <a
            href="https://github.com/ngxuantien"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
            class="group w-10 h-10 md:w-12 md:h-12 rounded-full border border-app-border bg-app-surface flex items-center justify-center text-yellow-400 hover:bg-yellow-400 hover:border-yellow-400 transition hover:-translate-y-0.5"
          >
            <svg
              class="w-5 h-5 md:w-6 md:h-6 transition group-hover:text-black"
            >
              <use href="icon/github.svg"></use>
            </svg>
          </a>

          <!-- LinkedIn -->
          <a
            href="https://www.linkedin.com/in/nguy%E1%BB%85n-xu%C3%A2n-ti%E1%BA%BFn-7a7b55258/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
            class="group w-10 h-10 md:w-12 md:h-12 rounded-full border border-app-border bg-app-surface flex items-center justify-center text-yellow-400 hover:bg-yellow-400 hover:border-yellow-400 transition hover:-translate-y-0.5"
          >
            <svg
              class="w-5 h-5 md:w-6 md:h-6 transition group-hover:text-black"
            >
              <use href="icon/linkedin.svg"></use>
            </svg>
          </a>
        </div>
      </form>
    </div>
  </div>
</section>
