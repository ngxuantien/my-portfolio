<section
  id="skills"
  class="min-h-screen bg-app-bg text-app-text px-4 py-20 md:px-8 md:py-24 lg:px-8 lg:py-28"
>
  <div class="max-w-6xl mx-auto">
    <div class="mb-8 md:mb-10 lg:mb-12">
      <h2 class="text-xl md:text-2xl lg:text-3xl font-bold tracking-tight">
        Technical Skills
      </h2>
    </div>

    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-5 lg:gap-6"
    >
      @for (skill of skillsList; track $index) {
        <div
          class="group p-5 md:p-6 lg:p-8 rounded-2xl lg:rounded-3xl cursor-default border border-brand-secondary/30 transition-all duration-300 hover:-translate-y-1 hover:border-brand-secondary hover:shadow-[0_0_20px_rgba(250,204,21,0.15)]"
        >
          <div class="flex items-center gap-3 mb-5 md:mb-6">
            <svg [class]="skill.iconClass">
              <use [attr.href]="skill.icon"></use>
            </svg>

            <p
              class="tracking-widest uppercase mb-1 text-base md:text-lg lg:text-xl font-bold text-app-text-primary"
            >
              {{ skill.category }}
            </p>
          </div>

          <ul class="space-y-2.5 md:space-y-3">
            @for (item of skill.items; track $index) {
              <li
                class="flex items-center gap-2.5 text-sm md:text-sm lg:text-base font-medium transition-colors duration-150 text-app-text-muted"
              >
                <span
                  class="w-1 h-1 rounded-full bg-app-text-primary shrink-0"
                ></span>
                <span>{{ item }}</span>
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>
