<div
  id="home"
  class="min-h-screen flex items-center justify-center bg-transparent text-app-text font-sans relative"
>
  <main class="w-full max-w-7xl mx-auto px-8 py-20 z-10">
    <div
      class="flex flex-col items-center justify-center text-center max-w-full mx-auto"
    >
      <div class="flex flex-col items-center">
        <div class="text-xl md:text-2xl tracking-widest leading-12 mb-8">
          Hi, I'm
          <h1 class="text-app-text-cream font-bold text-7xl">
            Nguyen Xuan Tien
          </h1>
        </div>
        <div class="h-[32px] flex items-center justify-center mb-10">
          <span id="typing" class="text-brand-primary text-4xl"></span>
        </div>
        <div class="text-app-text-soft text-xl leading-relaxed max-w-xl mb-10">
          I'm passionate about building modern, scalable, and user-focused web
          applications
        </div>

        <div
          class="flex flex-col sm:flex-row items-center space-y-4 sm:space-y-0 sm:space-x-4 w-full"
        >
          <button
            (click)="scrollTo('contact')"
            class="flex-1 cursor-pointer px-8 py-4 font-medium rounded-full text-black bg-linear-to-r from-brand-primary to-brand-secondary transition-all duration-300 shadow-md hover:shadow-lg hover:-translate-y-0.5"
          >
            Let's Connect
          </button>

          <button
            (click)="scrollTo('projects')"
            class="flex-1 cursor-pointer border border-brand-primary px-8 py-4 font-bold text-app-text-primary transition w-full rounded-full hover:shadow-lg hover:-translate-y-0.5"
          >
            Resume
          </button>
        </div>
        <div class="mt-10 flex text-app-text-soft items-center gap-2">
          <svg class="w-6 h-6 transition cursor-pointer hover:-translate-y-0.5">
            <use href="icon/map-pin.svg"></use>
          </svg>
          Ho Chi Minh City, Viet Nam
        </div>
      </div>
    </div>
  </main>
</div>
