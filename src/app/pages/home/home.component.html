<div
  id="home"
  class="min-h-screen flex items-center justify-center bg-app-bg text-app-text font-sans relative"
>
  <main class="w-full max-w-7xl mx-auto px-8 py-20 z-10">
    <div
      class="flex flex-col items-center justify-center text-center max-w-full mx-auto"
    >
      <div class="flex flex-col items-center">
        <div
          class="text-xl md:text-2xl lg:text-3xl tracking-widest leading-12 mb-8"
        >
          Hi, I'm
          <h1
            class="text-app-text-primary-name font-bold text-4xl md:text-5xl lg:text-7xl"
          >
            Nguyen Xuan Tien
          </h1>
        </div>
        <div class="h-[32px] flex items-center justify-center mb-10">
          <span
            id="typing"
            class="text-brand-hover text-3xl md:text-4xl lg:text-5xl"
          ></span>
        </div>
        <div
          class="text-app-text-soft text-base md:text-lg lg:text-xl leading-relaxed mb-10"
        >
          I'm passionate about building modern, scalable, and user-focused web
          applications
        </div>

        <div
          class="flex flex-col sm:flex-row items-center space-y-4 sm:space-y-0 sm:space-x-4 w-full"
        >
          <button
            (click)="scrollTo('contact')"
            class="flex-1 cursor-pointer border-2 border-brand-secondary px-8 py-4 font-bold rounded-full text-black bg-linear-to-r from-brand-secondary to-brand-hover transition-all duration-300 shadow-md hover:shadow-lg hover:-translate-y-0.5"
          >
            Let's Connect
          </button>

          <button
            type="button"
            (click)="isResumeOpen = true"
            class="flex-1 cursor-pointer border-2 border-brand-secondary px-8 py-4 font-bold text-app-text-primary transition rounded-full hover:shadow-lg hover:-translate-y-0.5"
          >
            Resume
          </button>
        </div>
        <div
          class="mt-10 text-sm md:text-base lg:text-lg flex text-app-text-soft items-center gap-2"
        >
          <svg class="w-6 h-6 transition cursor-pointer hover:-translate-y-0.5">
            <use href="icon/map-pin.svg"></use>
          </svg>
          Ho Chi Minh City, Viet Nam
        </div>
      </div>
    </div>
  </main>
</div>

@if (isResumeOpen) {
  <div
    class="fixed inset-0 z-999 bg-black/70 backdrop-blur-sm px-4 py-6 md:px-8 md:py-8"
    (click)="isResumeOpen = false"
  >
    <div
      class="relative mx-auto h-full max-w-5xl rounded-3xl border border-app-border bg-app-surface overflow-hidden"
      (click)="$event.stopPropagation()"
    >
      <div
        class="flex items-center justify-between px-4 py-3 md:px-6 md:py-4 border-b border-app-border"
      >
        <h3 class="text-app-text-primary font-bold">Resume</h3>

        <button
          type="button"
          (click)="isResumeOpen = false"
          class="w-9 h-9 rounded-full border border-app-border flex items-center justify-center text-app-text hover:bg-yellow-400 hover:text-black transition"
        >
          ✕
        </button>
      </div>

      <iframe
        src="./images/Abhishek_Agrawal.pdf"
        class="w-full h-[calc(100%-65px)]"
      ></iframe>
    </div>
  </div>
}
