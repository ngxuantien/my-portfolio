            sectionService.activeSection() === 'home'

            sectionService.activeSection() === 'skills'

              : 'hover:text-app-text-primary'
          "

        </a>

            sectionService.activeSection() === 'projects'
              ? 'text-app-text-primary'
              : 'hover:text-app-text-primary'
          "
        >
          Projects
        </a>

        <a

          class="cursor-pointer transition relative after:absolute after:-bottom-1 after:left-0 after:h-[2px] after:bg-brand-secondary after:transition-all after:w-0 hover:after:w-full"

              ? 'text-app-text-primary'
              : 'hover:text-app-text-primary'

        >
          Experience
        </a>

          class="cursor-pointer transition relative after:absolute after:-bottom-1 after:left-0 after:h-[2px] after:bg-brand-secondary after:transition-all after:w-0 hover:after:w-full"

            sectionService.activeSection() === 'contact'
              ? 'text-app-text-primary'
              : 'hover:text-app-text-primary'

      (click)="isMenuOpen = !isMenuOpen"
      aria-label="Toggle menu"
    >
      @if (!isMenuOpen) {
        <span class="leading-none">
          <img src="./icon/text-align-justify.svg" alt="Menu" />
        </span>
      } @else {
        <span class="leading-none">
          <img src="./icon/x.svg" alt="Close" />
        </span>

    [ngClass]="
      isMenuOpen
        ? 'opacity-100 scale-100 translate-y-0 pointer-events-auto'
        : 'opacity-0 scale-95 -translate-y-2 pointer-events-none'
    "

      <a
        (click)="scrollTo('home'); isMenuOpen = false"
        class="cursor-pointer rounded-2xl px-4 py-3 transition"
        [ngClass]="

            ? 'bg-brand-muted text-brand'
            : 'hover:bg-app-surface-muted hover:text-brand'
        "
      >

      </a>

        (click)="scrollTo('about'); isMenuOpen = false"
        class="cursor-pointer rounded-2xl px-4 py-3 transition"

            : 'hover:bg-app-surface-muted hover:text-brand'

        (click)="scrollTo('skills'); isMenuOpen = false"

          sectionService.activeSection() === 'experience'
            ? 'bg-brand-muted text-brand'
            : 'hover:bg-app-surface-muted hover:text-brand'
        "
      >
        Experience
      </a>

      <a
        (click)="scrollTo('contact'); isMenuOpen = false"
        class="cursor-pointer rounded-2xl px-4 py-3 transition"

          sectionService.activeSection() === 'contact'
            ? 'bg-brand-muted text-brand'
